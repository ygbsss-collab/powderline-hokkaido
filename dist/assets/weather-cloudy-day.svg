<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <!-- Background Gradient for Cloudy / Overcast Theme -->
    <linearGradient id="cloudySkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="50%" stop-color="#1e2c3d" />
      <stop offset="100%" stop-color="#0f1722" />
    </linearGradient>

    <!-- Multi-layered Cloud Gradients -->
    <linearGradient id="cloudLayer1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cloudLayer2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <pattern id="cloudyDotGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="498" height="138" rx="20" fill="url(#cloudySkyGrad)" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="2" y="2" width="496" height="136" rx="19" fill="url(#cloudyDotGrid)" />

  <!-- Mountain Peak Peeking through Cloud/Fog -->
  <path d="M220 140 L310 75 L380 120 L440 85 L500 125 L500 140 Z" fill="#334155" fill-opacity="0.35" />
  <path d="M310 75 L322 88 L302 92 Z" fill="#ffffff" fill-opacity="0.15" />

  <!-- Dense Volumetric Cloud Shapes (Right & Top) -->
  <!-- Back cloud cluster -->
  <ellipse cx="410" cy="42" rx="75" ry="32" fill="url(#cloudLayer1)" />
  <ellipse cx="340" cy="36" rx="55" ry="28" fill="url(#cloudLayer1)" />
  <ellipse cx="460" cy="50" rx="50" ry="25" fill="url(#cloudLayer1)" />

  <!-- Foreground cloud cluster with soft puffs -->
  <path d="M280 65 Q 295 40 330 45 Q 365 35 400 50 Q 435 40 460 65 Q 480 80 465 100 L 270 100 Q 260 80 280 65 Z" fill="url(#cloudLayer2)" />
  
  <!-- Subtle Fog Drift Streaks -->
  <path d="M50 45 Q 180 35 300 50" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.18" fill="none" stroke-dasharray="10 8" />
  <path d="M120 75 Q 250 65 420 80" stroke="#cbd5e1" stroke-width="1.2" stroke-opacity="0.2" fill="none" stroke-dasharray="16 10" />
  <path d="M30 110 Q 200 95 380 115" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.15" fill="none" stroke-dasharray="20 12" />
</svg>
