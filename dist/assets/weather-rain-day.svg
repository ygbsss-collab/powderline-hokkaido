<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <!-- Background Gradient for Dramatic Rain (비 - 강화 버전) -->
    <linearGradient id="rainSkyGradV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071728" />
      <stop offset="45%" stop-color="#0f263d" />
      <stop offset="100%" stop-color="#081420" />
    </linearGradient>

    <!-- Dense Storm Cloud Gradient -->
    <linearGradient id="stormCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.1" />
    </linearGradient>

    <!-- Cloud Back Rim Light / Distant Flash Glow -->
    <radialGradient id="rainGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#081420" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Dot Grid Overlay -->
    <pattern id="rainGridV2" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#93c5fd" fill-opacity="0.12" />
    </pattern>

    <!-- Water Drop Ripple Filter/Shape -->
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="498" height="138" rx="20" fill="url(#rainSkyGradV2)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
  <rect x="2" y="2" width="496" height="136" rx="19" fill="url(#rainGridV2)" />

  <!-- Atmosphere Glow -->
  <rect x="2" y="2" width="496" height="136" rx="19" fill="url(#rainGlow)" />

  <!-- Mountain Silhouette under Heavy Rain -->
  <path d="M120 140 L240 78 L310 110 L410 58 L500 105 L500 140 Z" fill="#132337" fill-opacity="0.7" />
  <path d="M0 140 L80 110 L190 140 L350 95 L460 140 Z" fill="#0d1b2b" fill-opacity="0.5" />

  <!-- Dense Rain Clouds with Highlights -->
  <ellipse cx="400" cy="22" rx="100" ry="38" fill="url(#stormCloudGrad)" />
  <ellipse cx="290" cy="18" rx="80" ry="32" fill="url(#stormCloudGrad)" />
  <ellipse cx="460" cy="30" rx="70" ry="35" fill="url(#stormCloudGrad)" />
  <ellipse cx="190" cy="12" rx="65" ry="26" fill="url(#stormCloudGrad)" opacity="0.7" />

  <!-- Heavy Diagonal Rain Streaks (Multi-depth & vivid drops) -->
  <!-- Layer 1: Long Sharp Falling Rain Streaks (18° slant) -->
  <g stroke="url(#streakGrad)" stroke-width="2" stroke-linecap="round">
    <line x1="90" y1="12" x2="68" y2="62" />
    <line x1="160" y1="20" x2="138" y2="72" />
    <line x1="220" y1="8" x2="198" y2="58" />
    <line x1="275" y1="25" x2="253" y2="78" />
    <line x1="330" y1="14" x2="308" y2="66" />
    <line x1="380" y1="28" x2="356" y2="82" />
    <line x1="435" y1="12" x2="411" y2="68" />
    <line x1="480" y1="22" x2="456" y2="76" />
  </g>

  <!-- Layer 2: Mid-to-Lower Rain & Secondary Showers -->
  <g stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.65">
    <line x1="125" y1="58" x2="105" y2="105" />
    <line x1="185" y1="70" x2="165" y2="118" />
    <line x1="240" y1="62" x2="220" y2="110" />
    <line x1="298" y1="75" x2="278" y2="124" />
    <line x1="360" y1="65" x2="340" y2="115" />
    <line x1="415" y1="70" x2="395" y2="120" />
    <line x1="465" y1="64" x2="445" y2="112" />
    <line x1="60" y1="70" x2="42" y2="115" />
  </g>

  <!-- Layer 3: Faint background drizzle for high density -->
  <g stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.35">
    <line x1="50" y1="15" x2="36" y2="48" />
    <line x1="130" y1="10" x2="116" y2="44" />
    <line x1="200" y1="30" x2="186" y2="64" />
    <line x1="310" y1="8" x2="296" y2="42" />
    <line x1="350" y1="35" x2="336" y2="68" />
    <line x1="450" y1="38" x2="436" y2="72" />
    <line x1="150" y1="90" x2="136" y2="125" />
    <line x1="270" y1="95" x2="256" y2="130" />
    <line x1="385" y1="92" x2="371" y2="126" />
  </g>

  <!-- Ground Splashes & Water Mist at Bottom -->
  <path d="M60 125 Q68 122 76 125" stroke="#bae6fd" stroke-width="1.5" fill="none" stroke-opacity="0.8" />
  <circle cx="68" cy="120" r="1.2" fill="#e0f2fe" />
  <path d="M160 128 Q168 124 176 128" stroke="#bae6fd" stroke-width="1.5" fill="none" stroke-opacity="0.8" />
  <circle cx="168" cy="122" r="1.2" fill="#e0f2fe" />
  <path d="M275 130 Q283 126 291 130" stroke="#bae6fd" stroke-width="1.5" fill="none" stroke-opacity="0.8" />
  <circle cx="283" cy="124" r="1.2" fill="#e0f2fe" />
  <path d="M392 126 Q400 122 408 126" stroke="#bae6fd" stroke-width="1.5" fill="none" stroke-opacity="0.8" />
  <circle cx="400" cy="120" r="1.2" fill="#e0f2fe" />

  <!-- Dense Mist Horizon -->
  <rect x="2" y="112" width="496" height="26" rx="10" fill="#0284c7" fill-opacity="0.16" />
</svg>
