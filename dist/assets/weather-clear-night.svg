<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <!-- Background Gradient for Clear Night (맑은 밤) -->
    <linearGradient id="clearNightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b18" />
      <stop offset="50%" stop-color="#091b34" />
      <stop offset="100%" stop-color="#020710" />
    </linearGradient>

    <!-- Moonlight / Lunar Aura Glow -->
    <radialGradient id="moonGlow" cx="82%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#1e3a8a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#040b18" stop-opacity="0" />
    </radialGradient>

    <!-- Alpine Night Silhouette Gradients -->
    <linearGradient id="ridgeFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3250" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#081426" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132338" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.4" />
    </linearGradient>

    <!-- Tech Dot Grid Overlay -->
    <pattern id="clearNightGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7dd3fc" fill-opacity="0.1" />
    </pattern>

    <!-- Twinkle Star Template -->
    <g id="star">
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#bae6fd" stroke-width="0.9" />
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#bae6fd" stroke-width="0.9" />
      <circle cx="0" cy="0" r="0.8" fill="#ffffff" />
    </g>
  </defs>

  <!-- Container Box with Powderline styling -->
  <rect x="1" y="1" width="498" height="138" rx="20" fill="url(#clearNightSky)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
  <rect x="2" y="2" width="496" height="136" rx="19" fill="url(#clearNightGrid)" />

  <!-- Moonlight Aura -->
  <rect x="2" y="2" width="496" height="136" rx="19" fill="url(#moonGlow)" />

  <!-- Prominent, Clear Crescent Moon (달) -->
  <g filter="drop-shadow(0 0 12px rgba(56, 189, 248, 0.75))">
    <circle cx="415" cy="38" r="28" fill="#38bdf8" fill-opacity="0.15" />
    <!-- Outer Crescent Body -->
    <path d="M 426 21 A 19 19 0 1 0 426 57 A 15 15 0 1 1 426 21 Z" fill="#e0f2fe" />
    <!-- Bright Inner Crescent Highlight -->
    <path d="M 424 23 A 17 17 0 1 0 424 55 A 14 14 0 1 1 424 23 Z" fill="#ffffff" />
  </g>

  <!-- Twinkling Starlight Field -->
  <use href="#star" x="335" y="22" opacity="0.9" />
  <use href="#star" x="275" y="32" opacity="0.8" />
  <use href="#star" x="205" y="18" opacity="0.75" />
  <use href="#star" x="145" y="28" opacity="0.8" />
  <use href="#star" x="85" y="18" opacity="0.85" />
  <use href="#star" x="465" y="24" opacity="0.8" />

  <circle cx="305" cy="14" r="1.1" fill="#ffffff" opacity="0.9" />
  <circle cx="245" cy="40" r="0.9" fill="#bae6fd" opacity="0.75" />
  <circle cx="175" cy="22" r="1.2" fill="#e0f2fe" opacity="0.85" />
  <circle cx="115" cy="44" r="0.8" fill="#ffffff" opacity="0.7" />

  <!-- Far Alpine Ridge with Moonlit Edge -->
  <path d="M120 140 L220 70 L280 100 L370 46 L460 110 L500 86 L500 140 Z" fill="url(#ridgeFar)" />
  <path d="M220 70 L238 82" stroke="#7dd3fc" stroke-width="1.3" stroke-opacity="0.5" fill="none" />
  <path d="M370 46 L392 62" stroke="#bae6fd" stroke-width="1.6" stroke-opacity="0.75" fill="none" />

  <!-- Near Mountain Ridge Silhouette -->
  <path d="M0 140 L50 106 L130 140 L260 84 L360 140 Z" fill="url(#ridgeNear)" />
  <path d="M260 84 L276 98" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" fill="none" />

  <!-- Bottom Ambient Edge -->
  <path d="M20 138 Q 250 132 480 138" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" fill="none" />
</svg>
