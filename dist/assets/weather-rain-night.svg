<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <!-- Background Gradient for Rainy Night (비 내리는 밤) -->
    <linearGradient id="rainNightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030b18" />
      <stop offset="45%" stop-color="#081b32" />
      <stop offset="100%" stop-color="#020812" />
    </linearGradient>

    <!-- Storm Moon Halo Glow peeking through dark rain clouds -->
    <radialGradient id="rainMoonGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#1d4ed8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#030b18" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Dot Grid Overlay -->
    <pattern id="rainNightGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#60a5fa" fill-opacity="0.1" />
    </pattern>

    <!-- Illuminated Night Rain Streak -->
    <linearGradient id="nightStreak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="498" height="138" rx="20" fill="url(#rainNightSky)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
  <rect x="2" y="2" width="496" height="136" rx="19" fill="url(#rainNightGrid)" />
  <rect x="2" y="2" width="496" height="136" rx="19" fill="url(#rainMoonGlow)" />

  <!-- Mountain Silhouette under Night Rain -->
  <path d="M120 140 L230 80 L310 112 L410 60 L500 102 L500 140 Z" fill="#0b1a2e" fill-opacity="0.85" />

  <!-- Moon Peeking through Night Rain Storm Clouds -->
  <g filter="drop-shadow(0 0 12px rgba(56, 189, 248, 0.7))">
    <circle cx="410" cy="36" r="26" fill="#38bdf8" fill-opacity="0.18" />
    <path d="M 421 20 A 18 18 0 1 0 421 54 A 14 14 0 1 1 421 20 Z" fill="#e0f2fe" fill-opacity="0.9" />
    <path d="M 419 22 A 16 16 0 1 0 419 52 A 13 13 0 1 1 419 22 Z" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- Night Storm Clouds surrounding the Moon -->
  <ellipse cx="440" cy="24" rx="80" ry="28" fill="#1e293b" fill-opacity="0.65" />
  <ellipse cx="360" cy="18" rx="65" ry="24" fill="#0f172a" fill-opacity="0.75" />
  <ellipse cx="270" cy="16" rx="60" ry="22" fill="#1e293b" fill-opacity="0.6" />

  <!-- Crisp Illuminated Night Rain Streaks (Slanted) -->
  <g stroke="url(#nightStreak)" stroke-width="1.8" stroke-linecap="round">
    <line x1="85" y1="12" x2="65" y2="58" />
    <line x1="155" y1="20" x2="135" y2="68" />
    <line x1="220" y1="10" x2="200" y2="56" />
    <line x1="275" y1="24" x2="255" y2="72" />
    <line x1="330" y1="14" x2="310" y2="64" />
    <line x1="380" y1="28" x2="360" y2="78" />
    <line x1="440" y1="14" x2="420" y2="64" />
    <line x1="480" y1="22" x2="460" y2="72" />
  </g>

  <!-- Lower Falling Rain Layer -->
  <g stroke="#7dd3fc" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="115" y1="62" x2="97" y2="105" />
    <line x1="175" y1="70" x2="157" y2="114" />
    <line x1="235" y1="64" x2="217" y2="108" />
    <line x1="295" y1="74" x2="277" y2="118" />
    <line x1="355" y1="68" x2="337" y2="112" />
    <line x1="415" y1="70" x2="397" y2="115" />
  </g>

  <!-- Night Ground Splash Ripples caught in Moonlight -->
  <path d="M97 122 Q105 119 113 122" stroke="#bae6fd" stroke-width="1.4" fill="none" stroke-opacity="0.8" />
  <circle cx="105" cy="117" r="1.1" fill="#ffffff" />
  <path d="M217 125 Q225 122 233 125" stroke="#bae6fd" stroke-width="1.4" fill="none" stroke-opacity="0.8" />
  <circle cx="225" cy="120" r="1.1" fill="#ffffff" />
  <path d="M337 126 Q345 123 353 126" stroke="#bae6fd" stroke-width="1.4" fill="none" stroke-opacity="0.8" />
  <circle cx="345" cy="121" r="1.1" fill="#ffffff" />

  <!-- Moonlit Water Mist at Bottom -->
  <rect x="2" y="115" width="496" height="23" rx="10" fill="#0284c7" fill-opacity="0.14" />
</svg>
